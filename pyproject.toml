[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numba-qaoa"
version = "0.1.0"
description = "Fast exact QAOA statevector simulator with Numba kernels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "numba>=0.59",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]
gw = [
  "cvxpy>=1.4",
]
plot = [
  "matplotlib>=3.6",
]

[tool.setuptools.packages.find]
include = ["numba_qaoa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
